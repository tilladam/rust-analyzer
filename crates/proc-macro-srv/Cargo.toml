[package]
name = "proc-macro-srv"
version = "0.0.0"
repository.workspace = true
description = "Proc-macro server for rust-analyzer."

authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
doctest = false

[dependencies]
object.workspace = true
libloading.workspace = true
memmap2.workspace = true
temp-dir.workspace = true

paths.workspace = true
# span = {workspace = true, default-features = false} does not work
span = { path = "../span", version = "0.0.0", default-features = false}
intern.workspace = true

# Only pulled in by the `slint-bench-pprof` feature, used by the in-process slint
# expansion profiling harness in `src/tests/slint_bench.rs`. Signal-based (SIGPROF)
# sampler, so it needs no `perf_event_open` / root access.
pprof = { version = "0.14", features = ["flamegraph"], optional = true }


[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
expect-test.workspace = true
line-index.workspace = true

# used as proc macro test targets
proc-macro-test.path = "./proc-macro-test"

[features]
default = []
in-rust-tree = []
# Enables the in-process pprof flamegraph for the slint expansion benchmark.
slint-bench-pprof = ["dep:pprof"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private=true
